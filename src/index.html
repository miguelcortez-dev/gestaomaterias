<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <!-- Política de segurança: apenas recursos locais do próprio app; sem scripts inline, rede ou frames. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Matérias</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="barra-topo">
      <div class="marca">
        <span class="marca-logo" aria-hidden="true"></span>
        <h1>Gestão de Matérias</h1>
      </div>
      <div class="acoes">
        <button type="button" id="btn-config" class="btn btn-fantasma" data-icone="ajustes" title="Configurações do curso">Configurações</button>
      </div>
    </header>

    <main id="quadro" class="quadro"></main>

    <!-- Configuração do número de períodos (primeira execução e "Configurações") -->
    <dialog id="dlg-config" class="dialogo" aria-labelledby="config-titulo">
      <form id="form-config" class="dialogo-corpo" novalidate>
        <h2 id="config-titulo">Configuração do curso</h2>
        <p id="config-intro" class="ajuda"></p>
        <label class="campo">
          <span class="campo-rotulo">Quantos períodos (semestres de 6 meses) o curso tem?</span>
          <input type="number" id="config-periodos" min="1" max="20" step="1" required>
        </label>
        <p class="ajuda">Se precisar de mais tempo para concluir o curso, você poderá adicionar períodos extras com o botão “+ Período”.</p>
        <p id="config-erro" class="erro-form" hidden></p>
        <footer class="dialogo-rodape">
          <button type="button" class="btn" id="config-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </footer>
      </form>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Ordem importa: modelo → utilitários → IPC → estado → app -->
    <script src="modelo.js"></script>
    <script src="ui.js"></script>
    <script src="ipc.js"></script>
    <script src="estado.js"></script>
    <script src="app.js"></script>
  </body>
</html>
